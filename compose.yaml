services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: reprgb
      POSTGRES_USER: reprgb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U reprgb -d reprgb]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgresql://reprgb:${POSTGRES_PASSWORD}@db:5432/reprgb
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - ./backups:/backups
      # For a private Frigate CA, mount its PEM here and set FRIGATE_CA_FILE.
      # - ./secrets/frigate-ca.pem:/run/secrets/frigate-ca.pem:ro
    restart: unless-stopped
  caddy:
    build: ../reprgb-site
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
